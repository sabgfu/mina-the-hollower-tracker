}

function home(){let p=progress();return '<section class="hero"><div class="eyebrow">GUIA DE EXPLORAÇÃO</div><h2>O compêndio de Tenebrous Isle</h2><p>Seu arquivo de jornada por Mina the Hollower. Consulte equipamentos, chefes e regiões; marque descobertas e acompanhe a conclusão do catálogo.</p><div style="margin-top:19px;display:flex;gap:10px;flex-wrap:wrap"><button class="btn primary" data-go="checklist">Continuar jornada ↗</button><button class="btn" data-go="trinkets">Explorar database</button></div></section><div class="metrics"><div class="metric"><strong>'+p+'%</strong><span>PROGRESSO DO CATÁLOGO</span></div><div class="metric"><strong>'+trinkets.length+'</strong><span>BUGIGANGAS NA LISTA</span></div><div class="metric"><strong>'+weapons.length+'</strong><span>ARMAS PRINCIPAIS</span></div><div class="metric"><strong>'+catalogCount()+'</strong><span>OBJETIVOS NO CHECKLIST DE 100%</span></div></div>'+shell("Explorar o compêndio","Escolha uma seção para consultar ou marcar seu progresso.",'<div class="grid">'+[['trinkets','✧','Bugigangas',trinkets.length+' registros'],['weapons','⚔','Armas',weapons.length+' armas principais'],['sidearms','⌁','Armas secundárias',sidearms.length+' nomes catalogados'],['bosses','☠','Chefes e encontros',bosses.length+' nomes nesta lista'],['regions','⚑','Regiões',regions.length+' áreas listadas'],['quests','✉','Missões e minijogos','Seção ainda não preenchida']].map(x=>'<button class="tile" data-go="'+x[0]+'"><span class="tileico">'+x[1]+'</span><b>'+x[2]+'</b><small>'+x[3]+'</small></button>').join("")+'</div>')+shell("Sua jornada",completedCount()+" de "+catalogCount()+" registros marcados.",'<div class="metric"><strong>'+completedCount()+'</strong><span>REGISTROS CONCLUÍDOS</span><div class="progressline"><i style="width:'+p+'%"></i></div></div>')+'<div class="callout">Importante: o catálogo ainda é parcial. O percentual mede somente os registros existentes nesta versão, não a conclusão oficial de 100% do jogo.</div>'}
function catalog(kind){let arr=[],heading="",sub="";
if(kind==="trinkets"){heading="Bugigangas";sub=trinkets.length+" registros · efeitos e locais documentados";arr=trinkets.map((x,i)=>({id:"trinket-"+i,name:x[0],desc:x[1],tag:x[3],place:x[2]}));}
if(kind==="weapons"){heading="Armas principais";sub="5 armas principais e suas características";arr=weapons.map((x,i)=>({id:"weapon-"+i,name:x[0],desc:x[1],tag:"Arma"}));}
if(kind==="sidearms"){heading="Armas secundárias";sub=sidearms.length+" sidearms · descrição de uso";arr=sidearms.map((x,i)=>({id:"sidearm-"+i,name:x,desc:sidearmDetails[i][1],tag:"Arma secundária"}));}
if(kind==="bosses"){heading="Chefes e mini-chefes";sub=bosses.length+" encontros listados pela referência · nomes protegidos pelo modo spoiler";arr=bosses.map((x,i)=>({id:"boss-"+i,name:x,desc:bossDetails[x]?.[1]||"Encontro confirmado no checklist de 100%.",place:bossDetails[x]?.[0]||"A confirmar",tag:"Chefe / mini-chefe"}));}
if(kind==="regions"){heading="Regiões principais";sub=regions.length+" áreas principais: Ossex e seis regiões de geradores";arr=regions.map((x,i)=>({id:"region-"+i,name:x,desc:regionDetails[x]?.[1]||"Região principal de Tenebrous Isle.",place:regionDetails[x]?.[0]||"Região",tag:"Região"}));}
if(["enemies","quests","achievements","upgrades","collectibles","endings","fish","songs","npcs"].includes(kind)){let names={enemies:"Inimigos",quests:"Missões & minijogos",achievements:"Conquistas",upgrades:"Melhorias",collectibles:"Colecionáveis",endings:"Epílogos regionais",fish:"Troféus de pesca",songs:"Songscrolls",npcs:"Personagens e NPCs"};heading=names[kind];arr=genericRecords(kind);sub=arr.length+" registros · dados compilados da referência comunitária";}
let q=query.toLowerCase();let shown=arr.filter(x=>(x.name+" "+x.desc+" "+(x.place||"")+" "+x.tag).toLowerCase().includes(q)&&(filter==="Todos"||x.tag===filter));let filters=["Todos",...new Set(arr.map(x=>x.tag))];let list=shown.map(x=>entry(x.id,x.name,x.desc,x.place||x.tag)).join("");return shell(heading,sub,'<div class="toolbar"><input class="search" id="q" placeholder="Buscar por nome, efeito ou região..." value="'+esc(query)+'"></div><div class="filters">'+filters.map(f=>'<button class="filter '+(filter===f?"active":"")+'" data-filter="'+esc(f)+'">'+esc(f)+'</button>').join("")+'</div><div class="muted" style="font-size:11px;margin:0 0 10px">'+shown.length+' registros exibidos · toque no nome para detalhes</div><div class="entries">'+(list||'<div class="empty">Nenhum registro encontrado.</div>')+'</div>')}
function checklist(){let cats=[["Bugigangas",trinkets.map((x,i)=>["trinket-"+i,x[0],x[1]])],["Armas",weapons.map((x,i)=>["weapon-"+i,x[0],x[1]])],["Armas secundárias",sidearms.map((x,i)=>["sidearm-"+i,x,sidearmDetails[i][1]])],["Chefes e mini-chefes",bosses.map((x,i)=>["boss-"+i,x,"Encontro confirmado"])],["Epílogos regionais",endingsData.map((x,i)=>["ending-"+i,x[0]+" — "+x[1],x[2]])],["Missões e minijogos",questsData.map((x,i)=>["quest-"+i,x[0],x[1]])],["Conquistas",achievementsData.map((x,i)=>["achievement-"+i,x[0],x[1]])],["Colecionáveis",collectiblesData.map((x,i)=>["collectible-"+i,x[0],x[1]])],["Melhorias",upgradesData.map((x,i)=>["upgrade-"+i,x[0],x[1]])],["Troféus de pesca",fishData.map((x,i)=>["fish-"+i,x[0],x[1]])],["Songscrolls",songsData.map((x,i)=>["song-"+i,x,"Faixa da trilha sonora"])] ];let all=cats.flatMap(c=>c[1]),finished=all.filter(x=>done(x[0])).length;return shell("Checklist de 100%",finished+" de "+all.length+" objetivos marcados.",'<div class="metric"><strong>'+Math.round(finished/all.length*100)+'%</strong><span>PROGRESSO DO CHECKLIST DE 329 OBJETIVOS</span><div class="progressline"><i style="width:'+Math.round(finished/all.length*100)+'%"></i></div></div>'+cats.map(c=>'<h3 style="font:18px Georgia;margin:22px 0 9px">'+c[0]+' <small class="muted">'+c[1].filter(x=>done(x[0])).length+'/'+c[1].length+'</small></h3><div class="entries">'+c[1].map(x=>entry(x[0],x[1],x[2],c[0])).join("")+'</div>').join("")+'<div class="callout">Este checklist acompanha as 11 categorias e os 329 objetivos da referência NiaMeowDB. O banco de inimigos e as regiões são páginas extras de consulta e não entram no percentual de 100%.</div>')}
function mapview(){return shell("Mapa interativo","Mapa externo mantido pelo MapGenie.",'<div class="detailcard"><p>O mapa precisa de conexão com a internet. Se não carregar dentro do app, abra-o diretamente.</p><button class="btn primary" id="openmap">Abrir MapGenie ↗</button><iframe src="https://mapgenie.io/mina-the-hollower" title="Mapa interativo" loading="lazy" style="width:100%;height:65vh;border:1px solid var(--line);border-radius:9px;margin-top:16px;background:#111"></iframe></div>')}
function placeholder(kind){let names={enemies:"Inimigos",quests:"Missões & minijogos",upgrades:"Melhorias",achievements:"Conquistas"};let details={enemies:"A seção de inimigos ainda não possui registros individuais verificados.",quests:"Missões, minijogos e desafios ainda serão catalogados com requisitos e recompensas.",upgrades:"Melhorias de equipamento, bolsas, frascos, Joules, vida e capas ainda serão catalogadas.",achievements:"Conquistas ainda serão catalogadas com condições de desbloqueio e avisos de conteúdo perdível."};return shell(names[kind],details[kind],'<div class="detailcard"><div class="eyebrow">SEÇÃO EM CONSTRUÇÃO</div><h3>'+names[kind]+'</h3><p class="muted">'+details[kind]+'</p><div class="callout">Esta seção não entra no percentual do catálogo enquanto não tiver uma lista confiável.</div></div>')}
function render(){let meta=navMeta[page]||navMeta.home;$("#crumb").textContent=meta[1];document.querySelectorAll("[data-page]").forEach(b=>b.classList.toggle("active",b.dataset.page===page));$("#navprogress").textContent=progress()+"%";let html=page==="home"?home():page==="checklist"?checklist():["trinkets","weapons","sidearms","bosses","regions","enemies","quests","achievements","upgrades","collectibles","endings","fish","songs","npcs"].includes(page)?catalog(page):page==="map"?mapview():placeholder(page);$("#view").innerHTML=html;$("#view").querySelectorAll("[data-go]").forEach(b=>b.onclick=()=>go(b.dataset.go));let q=$("#q");if(q)q.oninput=e=>{query=e.target.value;let pos=e.target.selectionStart;render();let n=$("#q");n.focus();n.setSelectionRange(pos,pos)};$("#view").querySelectorAll("[data-filter]").forEach(b=>b.onclick=()=>{filter=b.dataset.filter;render()});$("#view").querySelectorAll("[data-id]").forEach(c=>c.onchange=()=>{setDone(c.dataset.id,c.checked);render()});$("#view").querySelectorAll("[data-detail]").forEach(el=>el.onclick=()=>openDetail(el.dataset.detail));let m=$("#openmap");if(m)m.onclick=()=>window.open("https://mapgenie.io/mina-the-hollower","_blank","noopener")}
function go(p){page=p;query="";filter="Todos";render();window.scrollTo(0,0)}
document.querySelectorAll("[data-page]").forEach(b=>b.onclick=()=>go(b.dataset.page));
$("#spoilerBtn").onclick=()=>{spoilers=!spoilers;$("#spoilerBtn").textContent=spoilers?"◉ Spoilers: visíveis":"◉ Spoilers: ocultos";render()};
$("#detailClose").onclick=()=>$("#detailVeil").classList.remove("open");
$("#detailVeil").onclick=e=>{if(e.target.id==="detailVeil")$("#detailVeil").classList.remove("open")};
$("#importBtn").onclick=()=>$("#importFile").click();
$("#importFile").onchange=async e=>{const f=e.target.files[0];if(!f)return;try{const data=JSON.parse(await f.text());if(!data||typeof data!=="object"||Array.isArray(data))throw Error("invalid");saved={};for(const id of knownIds())if(data[id]===true)saved[id]=true;persist();render();alert("Backup importado com sucesso.");}catch(err){alert("Não foi possível importar. Escolha um backup JSON válido deste compêndio.")}e.target.value=""};
$("#resetBtn").onclick=()=>{if(confirm("Tem certeza que deseja apagar todo o progresso salvo neste dispositivo? Exporte um backup antes, se quiser guardá-lo.")){saved={};persist();render()}};
$("#exportBtn").onclick=()=>{let a=document.createElement("a"),u=URL.createObjectURL(new Blob([JSON.stringify(saved,null,2)],{type:"application/json"}));a.href=u;a.download="mina-compendium-backup.json";a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)};
render();if("serviceWorker"in navigator)window.addEventListener("load",()=>navigator.serviceWorker.register("./sw.js").then(reg=>reg.update()).catch(()=>{}));
</script></body></html>
