function allCount(){return trinkets.length+weapons.length+sidearms.length+bosses.length+regions.length}
function progress(){let n=Object.values(saved).filter(Boolean).length;return Math.min(100,Math.round(n/Math.max(1,allCount())*100))}

return '<div class="entry '+(done(id)?"done":"")+'"><input class="check" type="checkbox" data-id="'+esc(id)+'" '+(done(id)?"checked":"")+'><span class="entrybody" data-detail="'+esc(id)+'"><span class="entrytitle '+(hidden?"spoiler-name":"")+'">'+(hidden?"Encontro desconhecido":esc(name))+'</span><span class="entrydesc '+(hidden?"spoiler-name":"")+'">'+(hidden?"Revele os spoilers para consultar este registro.":esc(desc||"Registro catalogado"))+'</span>'+(tag?'<span class="tag">'+esc(tag)+'</span>':"")+'</span></div>'}
function recordFor(id){
let m=id.match(/^(trinket|weapon|sidearm|boss|region)-(\\d+)$/);if(!m)return null;let i=+m[2],k=m[1],x=null;
if(k==="trinket"&&trinkets[i])x={name:trinkets[i][0],desc:trinkets[i][1],place:trinkets[i][2],type:trinkets[i][3]};

return x?{...x,id}:null;
